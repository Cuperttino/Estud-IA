  savePdf(pdfBuild("Resumen - "+t.n+" ("+S.subs[t.s].n+")",bl),"resumen-"+(t.n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"tema")+".pdf");
}
function pdfExam(q,date,names){
  const bl=[];q.forEach((x,i)=>{bl.push({t:"q",s:(i+1)+". "+x.q});x.o.forEach((o,j)=>bl.push({t:"o",s:"ABCD"[j]+") "+o}))});
  bl.push({t:"pb"},{t:"h",s:"Soluciones"});
  q.forEach((x,i)=>bl.push({t:"p",s:(i+1)+". "+"ABCD"[x.a]+(x.e?" - "+x.e:"")}));
  savePdf(pdfBuild("Simulacro "+date.slice(8)+"/"+date.slice(5,7)+(names?" - "+names:""),bl),"simulacro-"+date+".pdf");
}

      b+='<g class="bl l'+((k*3+j)%4)+'"><ellipse cx="'+x+'" cy="'+(y+11)+'" rx="10" ry="12" fill="'+c+'" opacity=".2"/><ellipse cx="'+x+'" cy="'+(y+11)+'" rx="7" ry="9" fill="'+c+'" opacity=".3"/><rect x="'+(x-2.5)+'" y="'+y+'" width="5" height="5" rx="1" fill="#2a2a2a"/><ellipse cx="'+x+'" cy="'+(y+11)+'" rx="4.6" ry="6.6" fill="'+c+'"/><ellipse cx="'+(x-1.4)+'" cy="'+(y+8.5)+'" rx="1.2" ry="2" fill="#fff" opacity=".55"/></g>';
    });
  }
  g.innerHTML='<svg width="'+W+'" height="40" viewBox="0 0 '+W+' 40"><path d="'+d+'" fill="none" stroke="#3f5a44" stroke-width="2"/>'+b+'</svg>';
}
function snow(){
  const s=D.getElementById("xsnow");if(!s)return;
  const small=window.innerWidth<600,N=small?26:48,E=small?5:13,EM=["🎁","🎄","⭐","🔔","🧦","🦌","🍪","🎅","⛄","🍬","🤶","🎀"];
  let h="";
  for(let i=0;i<N;i++)h+='<i style="left:'+r(0,100).toFixed(1)+'%;font-size:'+r(7,17).toFixed(1)+'px;--d:'+r(9,20).toFixed(1)+'s;--dl:-'+r(0,20).toFixed(1)+'s;--dx:'+r(-60,60).toFixed(0)+'px;opacity:'+r(.55,1).toFixed(2)+'">❄︎</i>';
  for(let i=0;i<E;i++)h+='<b style="left:'+r(0,100).toFixed(1)+'%;font-size:'+r(20,32).toFixed(0)+'px;--d:'+r(14,26).toFixed(1)+'s;--dl:-'+r(0,26).toFixed(1)+'s;--dx:'+r(-90,90).toFixed(0)+'px">'+EM[i%EM.length]+'</b>';
  s.innerHTML=h;
}
function build(){
  if(root||!D.body)return;
  const st=(c,dl)=>'<div class="xst '+c+'" style="animation-delay:'+dl+'s">'+STOCK+'</div>';
  root=mk("div");root.id="xmas";root.setAttribute("aria-hidden","true");
  root.innerHTML='<div id="xgar"></div>'+st("a",0)+st("b",-1.6)+st("c",-.8)+st("d",-2.4)+(rm?'':'<div id="xsnow"></div><div id="xsleigh">'+SLEIGH+'</div>')+'<div id="xtree">'+treeSvg()+'</div><div id="xgifts">'+GIFTS+'</div>';
  D.body.appendChild(root);garland();if(!rm)snow();
}
function destroy(){if(root){root.remove();root=null}}
window.xmasApply=function(on){if(on){H.dataset.xmas="1";build()}else{delete H.dataset.xmas;destroy()}};
function toast(m){let t=D.getElementById("xtoast");if(!t){t=mk("div");t.id="xtoast";D.body.appendChild(t)}t.textContent=m;t.classList.remove("show");void t.offsetWidth;t.classList.add("show");clearTimeout(rt);rt=setTimeout(()=>t.classList.remove("show"),3200)}
function burst(el){
  const q=el.getBoundingClientRect(),cx=q.left+q.width/2,cy=q.top+q.height/2,E=["🎁","🎄","⭐","❄️","🔔","🎅","🦌","🧦","🍬","✨"];
  for(let i=0;i<22;i++){const p=mk("div","pop",E[i%E.length]),a=Math.random()*Math.PI*2,d=90+Math.random()*190;p.style.cssText="left:"+cx+"px;top:"+cy+"px;z-index:90;--x:"+(Math.cos(a)*d).toFixed(0)+"px;--y:"+(Math.sin(a)*d-60).toFixed(0)+"px";D.body.appendChild(p);setTimeout(()=>p.remove(),1300)}
}
D.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("#xmasT");if(!b)return;
  const on=!XM();try{LS.setItem("ge_xmas",on?"1":"0")}catch(_){}
  window.xmasApply(on);
  if(on){burst(b);toast("🎅 ¡Jo, jo, jo! Modo navideño activado")}else toast("Modo navideño desactivado");
  if(window.__redraw)window.__redraw();else{b.classList.toggle("on",on)}
});
window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(root)garland()},200)});
if(XM())build();
})();
</script>
