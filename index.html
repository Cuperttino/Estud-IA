async function login(){const id=id0(v("ae")),u=users()[id];if(!u||await H(v("ap"),u.salt)!==u.ph)return err("Correo o contraseña incorrectos.");LS.setItem("ge_sess",id);location.reload()}

async function forgot(){

<script>
(function(){if(!window.ME)return;
const K=k=>k+":"+ME.id,STUDY=ME.study||"mis estudios";
const COL=["#7c3aed","#f97316","#10b981","#ec4899","#0ea5e9","#eab308","#ef4444","#14b8a6","#8b5cf6","#84cc16","#f43f5e","#06b6d4"];
const DN=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"],DF=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const FR=["Cada sesión que terminas es una victoria pequeña 💪","Solo empieza: 25 minutos y listo ✨","Tu yo de diciembre te lo agradecerá 🎓","Constancia gana a motivación 🔥","Aunque no tengas ganas, empieza 🚀","Un bloque más y mereces un descanso 😌","Cada día cuenta, hoy también 🌟"];
const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>new Date(s+"T00:00:00");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TODAY=fmt(new Date());
let S={subs:ME.subs.map(s=>({n:s.n,d:s.d})),conf:ME.subs.map(()=>1.5),frozen:{},pend:null,exam:ME.exam,mode:"short",start:TODAY,done:{},days:ME.days,mins:ME.mins};
try{const x=JSON.parse(localStorage.getItem(K("eg2"))||"null");if(x&&x.subs)S=x}catch(e){}
S.days=S.days||ME.days;S.mins=S.mins||ME.mins;
const save=()=>{for(const k in KEYS){const h=hs(k);if(h!==LH[k]){LH[k]=h;S.ts[k]=Date.now()}}try{localStorage.setItem(K("eg2"),JSON.stringify(S))}catch(e){}sync()};
S.topics=S.topics||[];S.exams=S.exams||[];S.agenda=S.agenda||{};S.sleep=S.sleep||{};S.sai=S.sai||{};S.routine=S.routine||{};const KEYS={study:["subs","conf","exam","mode","start","done","pend","quickDone","days","mins","frozen"],agenda:["agenda"],sleep:["sleep","sai"],exams:["exams"],fc:["fc","fcdel"],tem:["tem"]};
const pick=ks=>{const o={};ks.forEach(k=>{if(S[k]!==undefined)o[k]=S[k]});return o};
const pay=k=>pick(KEYS[k]),hs=k=>JSON.stringify(pick(KEYS[k].filter(x=>x!=="frozen")));
S.gdel=S.gdel||[];
S.fc=S.fc||[];S.fcdel=S.fcdel||[];S.chats=S.chats||{};S.tem=S.tem||{};
if(typeof S.ts==="number"){const o=S.ts;S.ts={};Object.keys(KEYS).forEach(k=>{S.ts[k]=o})}else if(!S.ts)S.ts={};
const LH={},PHS={};for(const k in KEYS)LH[k]=hs(k);
let lastLoc="",DB=null,UID=null,lastSt="",lastT={},tmr=null;let tab="vg",tm=null,gt=null,qz=null,busy="",sel={};

function planOld(){
  const P={},w=S.subs.map(s=>+s.d),sum=w.reduce((a,b)=>a+b,0),c=w.map(()=>0);let tot=0;
  const n=S.mode==="short"?4:3,len=S.mode==="short"?25:50;
  const end=parse(S.exam);
  for(let d=parse(S.start);d<end;d.setDate(d.getDate()+1)){
    const g=d.getDay();if(!S.days.includes(g))continue;
    const days=Math.round((end-d)/864e5),rev=days<=7,arr=[];let last=-1;
    for(let k=0;k<n;k++){
      let b=0,bs=-1e9;
      w.forEach((wi,i)=>{let sc=wi/sum*(tot+1)-c[i]-(i===last?.6:0);if(sc>bs){bs=sc;b=i}});
      c[b]++;tot++;last=b;arr.push({s:b,len,rev,key:fmt(d)+"|"+k});
    }
    P[fmt(d)]=arr;
  }
  return P;
}
function stats(P){
  let t=0,d=0;Object.values(P).forEach(a=>a.forEach(x=>{t++;if(S.done[x.key])d++}));
  let streak=0;const dd=new Date();
  for(let i=0;i<60;i++){const g=dd.getDay();
    if(S.days.includes(g)){const a=P[fmt(dd)];if(a){if(a.some(x=>S.done[x.key]))streak++;else if(fmt(dd)!==TODAY)break}}
    dd.setDate(dd.getDate()-1)}
  const left=Math.max(0,Math.ceil((parse(S.exam)-parse(TODAY))/864e5));
  return{t,d,streak,left};
}
function boom(el,em){
  const r=el.getBoundingClientRect();
  for(let i=0;i<14;i++){const s=document.createElement("div");s.className="pop";s.textContent=em[i%em.length];
    s.style.left=r.left+r.width/2+"px";s.style.top=r.top+"px";
    s.style.setProperty("--x",(Math.random()*240-120)+"px");s.style.setProperty("--y",(-Math.random()*200-40)+"px");
    document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}
}
function ring(p){const r=50,C=2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#ffffff40" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 60 60)" style="transition:stroke-dashoffset .8s"/><text x="60" y="67" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">${Math.round(p*100)}%</text></svg>`;
}
function hero(P){
  const s=stats(P),p=s.t?s.d/s.t:0;
  return `<div class="card hero"><div class="row"><div class="grow"><h1>${bear(46)} ${greet()} ${esc(ME.name)}</h1><div class="sub">${FR[new Date().getDate()%FR.length]}</div></div>${ring(p)}</div>
  <div class="row"><div class="stat"><b>${s.left}</b><span>días al examen</span></div><div class="stat"><b>${s.streak}🔥</b><span>racha</span></div><div class="stat"><b>${s.d}/${s.t}</b><span>sesiones</span></div></div></div>`;
}
const PH={a:{t:"📘 Fase Aprender",d:"Entender y esquematizar el temario"},p:{t:"📝 Fase Practicar",d:"Autotests y preguntas sin apuntes"},r:{t:"🔁 Fase Repaso final",d:"Repasar errores y consolidar"}};
const PT={a:"Lee el tema y haz un esquema con tus palabras.",p:"Hazte un test o preguntas SIN mirar apuntes y anota los fallos.",r:"Repasa en voz alta solo tus errores y lo que más se te olvida."};
function stip(n){return""}
const tip=x=>PT[x.ph]+" "+stip(S.subs[x.s].n);
const eff=i=>+S.subs[i].d*(1+(3-S.conf[i])*.4);
const phase=d=>d<=7?"r":d<=21?"p":"a";
function plan(){
  const P={},w=S.subs.map((s,i)=>eff(i)),sum=w.reduce((a,b)=>a+b,0),c=w.map(()=>0);let tot=0,back=0;
  const len=S.mode==="short"?25:50,base=Math.max(1,Math.round(S.mins/len));
  const end=parse(S.exam),td=parse(TODAY);
  let rem=0;for(let d=new Date(Math.max(parse(S.start),td));d<end;d.setDate(d.getDate()+1)){const g=d.getDay();if(S.days.includes(g))rem++}
  for(let d=parse(S.start);d<end;d.setDate(d.getDate()+1)){
    const g=d.getDay();if(!S.days.includes(g))continue;
    const k0=fmt(d),days=Math.round((end-d)/864e5),ph=phase(days);let arr=S.frozen[k0];
    if(!arr){
      const extra=k0>=TODAY?Math.min(4,Math.ceil(back/Math.max(rem,1))):0,n=base+extra;arr=[];let last=-1;
      for(let k=0;k<n;k++){
        let b=0,bs=-1e9;
        w.forEach((wi,i)=>{let sc=wi/sum*(tot+1)-c[i]-(i===last?.6:0);if(sc>bs){bs=sc;b=i}});
        c[b]++;tot++;last=b;arr.push({s:b,len,ph,rev:ph==="r",rec:k>=base,key:k0+"|"+k});
      }
      if(k0<=TODAY)S.frozen[k0]=arr;
    }else arr.forEach(x=>{c[x.s]++;tot++});
    P[k0]=arr;
    if(k0<TODAY)arr.forEach(x=>{if(!S.done[x.key])back++});
  }
  save();return P;
}
function rate(){if(S.pend==null)return"";return `<div class="card"><h2>¿Cómo te ha ido ${esc(S.subs[S.pend].n)}?</h2><div class="sub">Tu respuesta ajusta el plan: lo que peor lleves recibirá más bloques.</div><div class="row"><button class="g grow" data-r="1">😟 Mal</button><button class="g grow" data-r="2">😐 Regular</button><button class="g grow" data-r="3">😄 Bien</button></div></div>`}
function prog(P){
  const R=S.subs.map(()=>[0,0]),len=S.mode==="short"?25:50;let T=0,D=0,ex=0,dn=0;
  Object.keys(P).forEach(k=>P[k].forEach(x=>{R[x.s][0]++;T++;const d=!!S.done[x.key];if(d){R[x.s][1]++;D++}if(k<TODAY){ex++;if(d)dn++}}));

  const bh=ex-dn,pace=ex===0?"":bh<=0?"Vas al día con el plan 👏":`Llevas ${bh} bloque${bh>1?"s":""} de retraso: se reparten solos en los próximos días, sin agobios.`;

function coach(P){

}
function hoy(P){

    h+=`<div class="card rest">${bear(96,!S.days.includes(g)?"sleep":"glasses")}<span class="e" style="display:none">${!S.days.includes(g)?"🛋️":"🎓"}</span>${!S.days.includes(g)?"Hoy es día de descanso. Recarga pilas, ¡te lo has ganado!":"No hay sesiones para hoy. Revisa la fecha del examen en Ajustes."}</div>`;

  }

  fc:R=>mergeFc(R),

  gym:R=>mergeGym(R.gym||[],R.gdel),
  agenda:(R,n)=>{S.agenda=dm(S.agenda,R.agenda||{},n)},
  routine:(R,n)=>{S.routine=dm(S.routine,R.routine||{},n)},

async function pull(){
  if(!DB)return false;
  const before=JSON.stringify(S),snap=await DB.collection("data/users/"+UID).get(),M={};
  snap.docs.forEach(d=>{M[d.id]=d});
  const hasNew=Object.keys(M).some(k=>k.indexOf("d_")===0);
  let L=null;if(!hasNew&&M.state){try{L=JSON.parse(M.state.data().json)}catch(e){}}
  for(const k in KEYS){
    let R=null;const dd=M["d_"+k];
    if(dd){try{R=JSON.parse(dd.data().json)}catch(e){}}
    else if(L){const o={};KEYS[k].forEach(f=>{if(L[f]!==undefined)o[f]=L[f]});R={ts:typeof L.ts==="number"?L.ts:0,d:o}}
    if(!R||!R.d)continue;
    MG[k](R.d,(R.ts||0)>(S.ts[k]||0));
    S.ts[k]=Math.max(S.ts[k]||0,R.ts||0);LH[k]=hs(k);
    const cur=JSON.stringify({ts:S.ts[k],d:pay(k)});if(dd&&dd.data().json===cur)PHS[k]=cur;
  }
  const rem=new Set();
  snap.docs.forEach(d=>{if(d.id.indexOf("t_")!==0)return;let t;try{t=JSON.parse(d.data().json)}catch(e){return}
    rem.add(t.id);const l=S.topics.find(x=>x.id===t.id);
    if(!l)S.topics.push(t);else if((t.summary||"").length>(l.summary||"").length)Object.assign(l,t);
    lastT[t.id]=t.text.length+"|"+(t.summary||"").length+"|"+t.n+"|"+t.s;TSY.add(t.id)});
  S.topics=S.topics.filter(t=>rem.has(t.id)||!TSY.has(t.id));svTSY();
  snap.docs.forEach(d=>{if(d.id.indexOf("c_")!==0)return;let C;try{C=JSON.parse(d.data().json)}catch(e){return}const id=d.id.slice(2),l=S.chats[id];if(!l||(C.u||0)>(l.u||0)){S.chats[id]=C;LC[id]=C.u+"|"+C.m.length}else if(C.u===l.u)LC[id]=l.u+"|"+l.m.length});
  const ch=before!==JSON.stringify(S);
  try{localStorage.setItem(K("eg2"),JSON.stringify(S))}catch(e){}
  return ch;
}

const cln=s=>String(s).replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/[\u2013\u2014]/g,"-").replace(/\u2192/g,"->").replace(/\*\*/g,"").replace(/[^\u0000-\u00ff]/g,"");
function pdfBuild(title,bl){
  const d=new window.jspdf.jsPDF({unit:"pt",format:"a4"}),W=d.internal.pageSize.getWidth()-100;let y=60;
  d.setFont("helvetica","bold");d.setFontSize(18);d.splitTextToSize(cln(title),W).forEach(l=>{d.text(l,50,y);y+=24});y+=10;
  bl.forEach(b=>{
    if(b.t==="pb"){d.addPage();y=60;return}
    const f=b.t==="h"?["bold",13]:b.t==="q"?["bold",11]:["normal",11],ind=b.t==="li"?14:b.t==="o"?16:0,lh=f[1]*1.4;
    d.setFont("helvetica",f[0]);d.setFontSize(f[1]);
    if(b.t==="h"){y+=8;if(y>740){d.addPage();y=60}}
    d.splitTextToSize((b.t==="li"?"- ":"")+cln(b.s),W-ind).forEach(l=>{if(y>780){d.addPage();y=60}d.text(l,50+ind,y);y+=lh});
    y+=b.t==="o"?1:5;
  });
  return d;
}
function savePdf(d,fn){try{d.save(fn)}catch(e){alert("No se pudo descargar el PDF.")}}
function pdfSummary(t){
  const bl=[];String(t.summary).split("\n").forEach(l=>{if(/^#{1,4} /.test(l))bl.push({t:"h",s:l.replace(/^#+ /,"")});else if(/^\s*[-*\u2022] /.test(l))bl.push({t:"li",s:l.replace(/^\s*[-*\u2022] /,"")});else if(l.trim())bl.push({t:"p",s:l})});
  savePdf(pdfBuild("Resumen - "+t.n+" ("+S.subs[t.s].n+")",bl),"resumen-"+(t.n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"tema")+".pdf");
}
function pdfExam(q,date,names){
  const bl=[];q.forEach((x,i)=>{bl.push({t:"q",s:(i+1)+". "+x.q});x.o.forEach((o,j)=>bl.push({t:"o",s:"ABCD"[j]+") "+o}))});
  bl.push({t:"pb"},{t:"h",s:"Soluciones"});
  q.forEach((x,i)=>bl.push({t:"p",s:(i+1)+". "+"ABCD"[x.a]+(x.e?" - "+x.e:"")}));
  savePdf(pdfBuild("Simulacro "+date.slice(8)+"/"+date.slice(5,7)+(names?" - "+names:""),bl),"simulacro-"+date+".pdf");
}

  if(t.dataset.fcdel){if(ask("f"+t.dataset.fcdel)){S.fcdel=S.fcdel||[];S.fcdel.push(String(t.dataset.fcdel));S.fc=S.fc.filter(x=>String(x.id)!==String(t.dataset.fcdel));save();draw()}return}
  if(t.id==="chsend"){chatSend();return}
  if(t.id==="chdel"){if(ask("chdel")){S.chats[rv]={u:Date.now(),m:[]};save();draw()}return}
  if(t.id==="mbtn"){menuOpen=!menuOpen;navRender();return}
  if(t.dataset.mclose){menuOpen=false;navRender();return}
  if(t.id==="tp"){if(tm){if(tm.p){tm.end=Date.now()+tm.rem;tm.p=false}else{tm.rem=Math.max(0,tm.end-Date.now());tm.p=true}tcard()}return}
  if(t.dataset.pet){PET=t.dataset.pet;try{localStorage.setItem(K("egpet"),PET);localStorage.setItem("ge_pet",PET)}catch(e){}brandRender();draw();toast(PETS[PET][0]+" elegido "+petEmo());return}
  if(t.id==="sndt"){ding(SND);return}
  if(t.dataset.tms!==undefined){tms=+t.dataset.tms;draw();window.scrollTo(0,0);return}
  if(t.dataset.tmb){tms=-1;draw();return}
  if(t.dataset.tk){const k=t.dataset.tk,m=S.tem[tms]=S.tem[tms]||{};if(m[k])delete m[k];else{m[k]=TODAY;if(Object.keys(m).length===20){toast("¡Asignatura completada! 🎉");boom(t,["🎉","⭐","🤍"])}}save();draw();return}
  if(t.dataset.tall){const m=S.tem[tms]=S.tem[tms]||{};for(let n=1;n<=20;n++)if(!m[n])m[n]=TODAY;save();draw();return}
  if(t.dataset.tclr){if(ask("tclr")){S.tem[tms]={};save();draw()}return}
  if(t.dataset.say){const tp=S.topics.find(x=>x.id===+t.dataset.say.slice(1));if(tp)startTTS(tp.n,t.dataset.say[0]==="s"?tp.summary:tp.text);return}
  if(t.dataset.pdf){const tp=S.topics.find(x=>x.id===+t.dataset.pdf);if(tp)pdfSummary(tp);return}
  if(t.id==="qpdf"){if(qz)pdfExam(qz.q,TODAY,"");return}
  if(t.dataset.exdel){if(ask("e"+t.dataset.exdel)){S.exams.splice(+t.dataset.exdel,1);save();draw()}return}
  if(t.dataset.ex){const x=S.exams[+t.dataset.ex];if(x&&x.q)pdfExam(x.q,x.date,x.names);return}
  if(t.dataset.r){const i=S.pend;if(i!=null)S.conf[i]=Math.round((S.conf[i]*.7+.3*(+t.dataset.r))*100)/100;S.pend=null;save();draw();return}
  if(t.dataset.q){unlockAudio();tm={end:Date.now()+600000,s:+t.dataset.q,key:null};draw();return}
  if(t.dataset.k){const k=t.dataset.k;if(S.done[k])delete S.done[k];else{finish(k,t);return}save();draw();return}
  if(t.dataset.t!==undefined){const x=P[TODAY][+t.dataset.t];unlockAudio();tm={end:Date.now()+x.len*60000,s:x.s,key:x.key};draw();return}
  if(t.id==="tx"){tm=null;draw();return}
  if(t.id==="gadd"){const m=+document.getElementById("gm").value,d=document.getElementById("gd").value;if(m>0&&d){S.gym.push({date:d,min:m,id:Date.now()+(++uid)});save();boom(t,["💪","🔥","🏆"]);setTimeout(draw,500)}return}
  if(t.id==="gst"){if(gt){const m=Math.max(1,Math.round((Date.now()-gt)/6e4));gt=null;draw();document.getElementById("gm").value=m}else{gt=Date.now();draw()}return}
  if(t.dataset.gdel){const[d,m]=t.dataset.gdel.split("|");const i=S.gym.findIndex(x=>x.date===d&&x.min==m);if(i>=0){const x=S.gym.splice(i,1)[0];S.gdel=S.gdel||[];S.gdel.push(gk(x))}save();draw();return}
  if(t.id==="sv"){
    rdSubs();const dys=[...document.querySelectorAll(".dy:checked")].map(x=>+x.value);if(!dys.length){toast("Elige al menos un día de estudio.");return}
    const mn=Math.max(15,Math.min(720,+document.getElementById("mn").value||S.mins)),ne=document.getElementById("ex").value||S.exam,nm=document.getElementById("md").value;
    if(ne!==S.exam||nm!==S.mode){S.done={};S.frozen={};S.start=TODAY}
    else if(mn!==S.mins||dys.join()!==S.days.join()){if(!(S.frozen[TODAY]||[]).some(x=>S.done[x.key]))delete S.frozen[TODAY]}
    S.days=dys;S.mins=mn;S.exam=ne;S.mode=nm;save();tab="hoy";draw();boom(t,["✅","✨"]);return}
  if(t.id==="rs"){if(ask("rs")){S.done={};S.frozen={};S.conf=S.subs.map(()=>1.5);S.pend=null;S.start=TODAY;save();draw()}}
});
setInterval(()=>{
  if(tm){if(!tm.p&&Date.now()>=tm.end){ding();toast("¡Bloque terminado! 🎉");try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}const k=tm.key;if(k)finish(k,null);else{tm=null;S.quickDone=TODAY;save();draw()}boom(document.body,["🎉","⭐","✨"]);}else tcard()}
  if(gt&&tab==="gym"){const b=document.getElementById("gst");if(b)b.textContent="⏹ Parar ("+Math.max(1,Math.round((Date.now()-gt)/6e4))+" min)"}
},1000);
draw();
})();
</script></body></html>
